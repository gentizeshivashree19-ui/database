<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order Database</title>
  <meta name="theme-color" content="#f7f3e9">
  <style>
    :root { --bg:#f7f3e9; --card:#ffffff; --text:#2b2b2b; --muted:#616161; --accent:#8b1e3f; --accent2:#e8b44b; }
    * { box-sizing: border-box; }
    html,body { height:100%; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; color: var(--text); background: radial-gradient(1000px 600px at 20% 0%, #efe7d7 0%, #f7f3e9 60%, #fbf9f4 100%); display:block; padding:24px; }
    .wrap { width:100%; max-width: 1000px; margin: 0 auto; }
    .nav { display:flex; align-items:center; justify-content:space-between; margin-bottom: 18px; }
    .brand { display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:.3px; }
    .brand-badge { width:32px; height:32px; border-radius:8px; background: linear-gradient(135deg, var(--accent), var(--accent2)); display:grid; place-items:center; color:#fff; font-weight:900; }
    .card { background: color-mix(in oklab, var(--card) 100%, #000 0%); border: 1px solid color-mix(in oklab, var(--card) 88%, #000 12%); border-radius: 18px; overflow:hidden; box-shadow: 0 20px 60px rgba(0,0,0,.08); }
    .header { display:flex; gap:12px; align-items:center; justify-content:space-between; padding: 14px 18px; border-bottom:1px dashed color-mix(in oklab, var(--card) 88%, #000 12%); }
    .tools { display:flex; gap:10px; }
    input[type="search"] { width:220px; padding:10px 12px; border-radius:10px; border:1px solid color-mix(in oklab, var(--card) 88%, #000 12%); background:#fff; color: var(--text); }
    .list { padding: 12px 18px; }
    .row { display:grid; grid-template-columns: 1.4fr 1.6fr .8fr .6fr 1.2fr; gap:12px; align-items:center; padding: 12px; border:1px solid color-mix(in oklab, var(--card) 88%, #000 12%); border-radius:12px; background:#ffffff; margin-bottom:10px; }
    .head { font-weight:800; background:#faf7ef; }
    .muted { color: var(--muted); }
    .pill { display:inline-block; padding:6px 10px; border-radius:999px; background: linear-gradient(135deg, var(--accent), var(--accent2)); color:#fff; font-weight:700; font-size:12px; }
    .actions { display:flex; gap:10px; }
    .btn { text-decoration:none; color:#ffffff; background: linear-gradient(135deg, var(--accent), var(--accent2)); padding: 10px 14px; border-radius: 10px; font-weight: 700; }
    @media (max-width: 900px) { .row { grid-template-columns: 1fr; gap:8px; } .head { display:none; } }
  </style>
  <meta name="robots" content="noindex,nofollow">
</head>
<body>
  <div class="wrap">
    <div class="nav">
      <div class="brand"><div class="brand-badge">E</div><div>Order Database</div></div>
      <a href="index.html" style="color: var(--muted); text-decoration:none; font-size: 14px;">Back</a>
    </div>
    <div class="card">
      <div class="header">
        <div class="muted">Orders</div>
        <div class="tools">
          <input id="search" type="search" placeholder="Search name or email">
          <a id="export" class="btn" href="#">Export CSV</a>
        </div>
      </div>
      <div class="list" id="list">
        <div class="row head">
          <div>Customer</div>
          <div>Email</div>
          <div>Method</div>
          <div>Amount</div>
          <div>Order</div>
        </div>
      </div>
    </div>
  </div>
  <script>
    const list = document.getElementById('list');
    const search = document.getElementById('search');
    function load() {
      const all = JSON.parse(localStorage.getItem('orders') || '[]');
      const q = search.value.trim().toLowerCase();
      const filtered = q ? all.filter(o => (o.name||'').toLowerCase().includes(q) || (o.email||'').toLowerCase().includes(q)) : all;
      render(filtered);
    }
    function render(items) {
      list.querySelectorAll('.row.item').forEach(el => el.remove());
      items.forEach(o => {
        const row = document.createElement('div');
        row.className = 'row item';
        const name = document.createElement('div');
        name.textContent = o.name || '';
        const email = document.createElement('div');
        email.textContent = o.email || '';
        const method = document.createElement('div');
        method.textContent = (o.method||'').toUpperCase();
        const amount = document.createElement('div');
        amount.textContent = (o.currency||'INR') + ' ' + (o.amount||0);
        const order = document.createElement('div');
        order.textContent = o.id + ' • ' + new Date(o.time).toLocaleString();
        row.append(name,email,method,amount,order);
        list.appendChild(row);
      });
    }
    search.addEventListener('input', load);
    document.getElementById('export').addEventListener('click', function(e) {
      e.preventDefault();
      const items = JSON.parse(localStorage.getItem('orders') || '[]');
      const headers = ['id','name','email','method','amount','currency','product','status','time'];
      const rows = [headers.join(',')].concat(items.map(o => headers.map(h => JSON.stringify(o[h]||'')).join(',')));
      const blob = new Blob([rows.join('\n')], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'orders.csv'; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });
    load();
  </script>
</body>
</html>
